name: Windows acceptance preparation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  npm_config_engine_strict: 'true'

jobs:
  candidate:
    # One Linux TUI/package/standalone gate exports validated immutable Windows inputs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.4.0'
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/ci-tests.mjs bun-tui
      - run: npm run test:package:built
        env:
          VIVI_TEST_BUN: bun
          VIVI_TEST_CANDIDATE_DIR: ${{ runner.temp }}/canonical-npm-candidate
      - run: bun scripts/test-standalone.ts
      - run: bun scripts/build-standalone.ts
      - run: ./build/vivi --help
      # Exact private archive plus nonsecret metadata/evidence only.
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-private-npm-candidate
          path: |
            ${{ runner.temp }}/canonical-npm-candidate/ayayaq-vivi-cli-0.1.0-dev.0.tgz
            ${{ runner.temp }}/canonical-npm-candidate/candidate.json
            ${{ runner.temp }}/canonical-npm-candidate/package-evidence.json
          if-no-files-found: error

  mcp:
    # All minimum-Node Windows MCP cases premerge; full current-Node on main/manual.
    # Native helpers stay serial inside their isolated runner, without longer deadlines.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(github.event_name == 'pull_request' && '["26.4.0"]' || '["26.4.0", "26"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          architecture: x64
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/ci-tests.mjs windows-mcp

  headless:
    # All remaining minimum-Node Windows headless cases; full current on main/manual.
    # Packed minimum-Node behavior belongs to bun below, using the same archive.
    needs: candidate
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(github.event_name == 'pull_request' && '["26.4.0"]' || '["26.4.0", "26"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          architecture: x64
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/ci-tests.mjs windows-headless
      - uses: actions/download-artifact@v4
        if: matrix.node == '26'
        with:
          name: canonical-private-npm-candidate
          path: ${{ runner.temp }}/canonical-npm-candidate
      - run: npm run test:package:built
        if: matrix.node == '26'
        env:
          VIVI_TEST_PACKAGE_ARCHIVE: ${{ runner.temp }}/canonical-npm-candidate/ayayaq-vivi-cli-0.1.0-dev.0.tgz
          VIVI_TEST_PACKAGE_METADATA: ${{ runner.temp }}/canonical-npm-candidate/candidate.json
          VIVI_TEST_ACCEPTANCE_REPORT: ${{ runner.temp }}/windows-current-package-evidence.json
      - uses: actions/upload-artifact@v4
        if: matrix.node == '26'
        with:
          name: windows-current-node-headless-evidence
          path: ${{ runner.temp }}/windows-current-package-evidence.json
          if-no-files-found: error

  current-compatibility:
    # Actual current Node startup, argv/env, binary I/O, cancellation and descendant cleanup.
    # OAuth callback/lifecycle files are included automatically when present in the checkout.
    if: github.event_name == 'pull_request'
    needs: candidate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          architecture: x64
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: canonical-private-npm-candidate
          path: ${{ runner.temp }}/canonical-npm-candidate
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/ci-tests.mjs windows-current
      - run: npm run test:package:built
        env:
          VIVI_TEST_PACKAGE_ARCHIVE: ${{ runner.temp }}/canonical-npm-candidate/ayayaq-vivi-cli-0.1.0-dev.0.tgz
          VIVI_TEST_PACKAGE_METADATA: ${{ runner.temp }}/canonical-npm-candidate/candidate.json
          VIVI_TEST_ACCEPTANCE_REPORT: ${{ runner.temp }}/windows-current-package-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: windows-current-node-headless-evidence
          path: ${{ runner.temp }}/windows-current-package-evidence.json
          if-no-files-found: error

  bun:
    # One pinned Windows Bun runtime, stock OS transport and packed minimum-Node gate.
    # No physical Windows Terminal, live keys, providers or native credential store.
    needs: candidate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.4.0'
          architecture: x64
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/download-artifact@v4
        with:
          name: canonical-private-npm-candidate
          path: ${{ runner.temp }}/canonical-npm-candidate
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/ci-tests.mjs bun-boundaries
      - name: Verify real stock Windows fallback transport
        run: |
          $env:VIVI_TEST_BUN = (Get-Command bun -CommandType Application).Source
          $env:VIVI_TEST_POWERSHELL = (Get-Command pwsh -CommandType Application).Source
          node scripts/ci-tests.mjs windows-stock
      - run: node scripts/ci-tests.mjs bun-tui
      - run: npm run test:package:built
        env:
          VIVI_TEST_BUN: bun
          VIVI_TEST_PACKAGE_ARCHIVE: ${{ runner.temp }}/canonical-npm-candidate/ayayaq-vivi-cli-0.1.0-dev.0.tgz
          VIVI_TEST_PACKAGE_METADATA: ${{ runner.temp }}/canonical-npm-candidate/candidate.json
          VIVI_TEST_ACCEPTANCE_REPORT: ${{ runner.temp }}/windows-minimum-package-evidence.json
      - run: bun scripts/test-standalone.ts
      - run: bun scripts/build-standalone.ts
      - run: .\build\vivi.exe --help
      - uses: actions/upload-artifact@v4
        with:
          name: windows-minimum-node-bun-headless-evidence
          path: ${{ runner.temp }}/windows-minimum-package-evidence.json
          if-no-files-found: error

  packaged-conpty:
    # Independent hash-pinned mode1 gate. It consumes no canonical npm artifact.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.4.0'
          architecture: x64
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: npm ci --ignore-scripts
      - name: Prepare hash-pinned official Microsoft ConPTY pair
        run: |
          ./test/fixtures/windows-conpty/prepare-pinned-backend.ps1 -Destination (Join-Path $env:RUNNER_TEMP 'vivi-conpty-wt-1.24.12741.0')
      - name: Verify real pinned mode1 transport
        run: |
          $env:VIVI_TEST_BUN = (Get-Command bun -CommandType Application).Source
          $env:VIVI_TEST_POWERSHELL = (Get-Command pwsh -CommandType Application).Source
          $env:VIVI_TEST_CONPTY_PINNED_DIRECTORY = Join-Path $env:RUNNER_TEMP 'vivi-conpty-wt-1.24.12741.0'
          node scripts/ci-tests.mjs windows-modern
      - name: Remove the private Microsoft backend
        if: always()
        run: |
          $directory = Join-Path $env:RUNNER_TEMP 'vivi-conpty-wt-1.24.12741.0'
          if (Test-Path -LiteralPath $directory) { Remove-Item -LiteralPath $directory -Recurse -Force }
